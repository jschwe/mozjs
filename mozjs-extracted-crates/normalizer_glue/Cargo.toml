[package]
links = "normalizer_glue"
name = "mozjs_normalizer_glue"
version = "153.0.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
icu_normalizer = { package = "mozjs_icu_normalizer", path = "../icu_normalizer", features = ["compiled_data", "utf16_iter", "latin1"] }
write16 = { version  = "1.0", features = ["smallvec"] }
smallvec = "1.9.0"
encoding_rs = "0.8"

[build-dependencies.cbindgen]
version = "0.29.4"
